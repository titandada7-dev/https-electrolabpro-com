name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  quality:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check dependencies
        run: node scripts/check-deps.mjs

      - name: Prepare reports directory
        run: mkdir -p reports

      - name: Lint (report)
        id: lint
        continue-on-error: true
        run: |
          set -o pipefail
          bun run lint -- --format json --output-file reports/lint-report.json
          bun run lint | tee reports/lint-report.txt

      - name: Test (report)
        id: test
        continue-on-error: true
        run: |
          set -o pipefail
          bunx vitest run \
            --reporter=default \
            --reporter=junit --outputFile=reports/test-results.junit.xml \
            --reporter=json --outputFile=reports/test-results.json \
            | tee reports/test-output.txt

      - name: Upload lint & test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-test-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload accessibility (contrast) report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-report
          path: reports/a11y/
          if-no-files-found: warn
          retention-days: 14

      - name: Fail if lint or tests failed
        if: steps.lint.outcome == 'failure' || steps.test.outcome == 'failure'
        run: |
          echo "Lint outcome: ${{ steps.lint.outcome }}"
          echo "Test outcome: ${{ steps.test.outcome }}"
          exit 1

      - name: Build
        run: bun run build

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-dist
          path: dist/
          if-no-files-found: warn
          retention-days: 14

  lighthouse:
    name: Lighthouse CI (Accessibility ≥ AA)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node (for Lighthouse CI)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Run Lighthouse CI
        id: lhci
        continue-on-error: true
        run: |
          mkdir -p reports/lighthouse
          npx --yes @lhci/cli@0.14.x autorun --config=.lighthouserc.json | tee reports/lighthouse/lhci-output.txt

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: reports/lighthouse/
          if-no-files-found: warn
          retention-days: 14

      - name: Fail if accessibility below AA
        if: steps.lhci.outcome == 'failure'
        run: |
          echo "Lighthouse accessibility check failed — see the 'lighthouse-report' artifact."
          exit 1

